name: Containers

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      custom_tag:
        description: Optional additional image tag
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Run focused unit tests
        run: |
          python -m unittest discover -s tests -v
          python -m py_compile images/hub/rootfs/usr/local/bin/hub-reconcile
      - name: Run ShellCheck
        run: >-
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0
          scripts/*.sh images/common/*.sh
          images/hub/rootfs/usr/local/bin/dev-enter
          images/hub/rootfs/usr/local/bin/dev-session
          images/hub/rootfs/usr/local/bin/hub-entrypoint
          images/hub/rootfs/usr/local/bin/herdr-server-launch
          images/hub/rootfs/usr/local/bin/ccgram-launch
          images/hub/rootfs/usr/local/bin/hub-healthcheck
          images/hub/rootfs/usr/local/bin/image-versions
          images/workspace/rootfs/usr/local/bin/image-versions
          deploy/setup.sh
      - name: Run Hadolint
        run: |
          for dockerfile in images/hub/Dockerfile images/workspace/Dockerfile; do
            docker run --rm -i hadolint/hadolint:v2.15.1-debian < "$dockerfile"
          done
      - name: Validate Compose
        run: ./scripts/validate-compose.sh
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          version: v0.36.1
      - name: Validate Bake
        run: docker buildx bake --print >/dev/null
      - name: Build hub for the native CI platform
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: images/hub/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: devctl-hub:test
          cache-from: type=gha,scope=test-hub
          cache-to: type=gha,mode=max,scope=test-hub
      - name: Build workspace for the native CI platform
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: images/workspace/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: devctl-workspace:test
          cache-from: type=gha,scope=test-workspace
          cache-to: type=gha,mode=max,scope=test-workspace
      - name: Smoke-test images and developer-owned CLIs
        env:
          HUB_IMAGE: devctl-hub:test
          WORKSPACE_IMAGE: devctl-workspace:test
        run: ./scripts/smoke-test.sh

  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: [hub, workspace]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Normalize owner
        id: owner
        shell: bash
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          version: v0.36.1
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate tags and OCI labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ steps.owner.outputs.value }}/devctl-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.custom_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.custom_tag != '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Build and optionally publish
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: images/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            BUILD_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true
      - name: Publish GitHub artifact attestation
        if: github.event_name != 'pull_request' && github.event.repository.visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ steps.owner.outputs.value }}/devctl-${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Add digest to summary
        shell: bash
        run: |
          {
            echo "### devctl-${{ matrix.image }}"
            echo '```text'
            echo '${{ steps.build.outputs.digest }}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
