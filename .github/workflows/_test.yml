name: Reusable tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: devctl/pyproject.toml
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -e './devctl[dev]'
      - name: Check Python format and lint
        run: |
          python -m ruff format --check devctl
          python -m ruff check devctl
      - name: Type-check Python
        run: cd devctl && python -m mypy src
      - name: Run unit tests
        run: cd devctl && python -m pytest
      - name: Run ShellCheck
        run: >-
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0
          scripts/*.sh images/common/*.sh
          scripts/devctl-host
          images/hub/rootfs/usr/local/bin/dev-enter
          images/hub/rootfs/usr/local/bin/hub-entrypoint
          images/hub/rootfs/usr/local/bin/herdr-server-launch
          images/hub/rootfs/usr/local/bin/ccgram-launch
          images/hub/rootfs/usr/local/bin/hub-healthcheck
          images/hub/rootfs/usr/local/bin/devctl-versions
          images/workspace/rootfs/usr/local/bin/devctl-versions
      - name: Run Hadolint
        run: |
          for dockerfile in images/hub/Dockerfile images/workspace/Dockerfile; do
            docker run --rm -i hadolint/hadolint:v2.15.1-debian < "$dockerfile"
          done
      - name: Validate Compose
        run: ./scripts/validate-compose.sh
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          version: v0.36.1
      - name: Validate Bake
        run: docker buildx bake --print >/dev/null
      - name: Build both images for the CI platform
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: images/hub/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=test-hub
          cache-to: type=gha,mode=max,scope=test-hub
      - name: Build workspace image for the CI platform
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: images/workspace/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=test-workspace
          cache-to: type=gha,mode=max,scope=test-workspace
