version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /devctl
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /images/hub
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /images/workspace
    schedule:
      interval: weekly
