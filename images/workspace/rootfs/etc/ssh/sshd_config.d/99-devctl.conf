PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
AuthorizedKeysFile /etc/ssh/authorized_keys
PermitUserEnvironment no
AllowUsers developer
AllowTcpForwarding yes
AllowStreamLocalForwarding yes
GatewayPorts no
X11Forwarding no
PermitTunnel no
ClientAliveInterval 60
ClientAliveCountMax 3
UsePAM no
SetEnv CODEX_HOME=/home/developer/.codex CLAUDE_CONFIG_DIR=/home/developer/.claude GH_CONFIG_DIR=/home/developer/.config/gh HERDR_SOCKET_PATH=/run/herdr/herdr.sock CCGRAM_DIR=/srv/devctl/ccgram WORKSPACE_PATH=/workspace/project SSH_AUTH_SOCK=/run/devctl-ssh-agent
HostKey /etc/ssh/devctl-host-keys/ssh_host_ed25519_key
HostKey /etc/ssh/devctl-host-keys/ssh_host_rsa_key
