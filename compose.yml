name: hermes

services:
  hermes:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:v2026.8.31}
    restart: unless-stopped
    command: ["gateway", "run"]
    environment:
      HERMES_UID: ${PUID:?Set PUID in .env}
      HERMES_GID: ${PGID:?Set PGID in .env}
    volumes:
      - ./data:/opt/data
    logging:
      options:
        max-size: 10m
        max-file: "3"
